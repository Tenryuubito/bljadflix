name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r backend/requirements.txt httpx

      - name: Tests ausführen
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

  android-build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lokalen JDK-Pfad aus gradle.properties überschreiben
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      - name: Konfiguration prüfen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Repository-Variable BACKEND_URL fehlt (z. B. http://34.12.34.56:8000/)"
            exit 1
          fi
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt"
            exit 1
          fi

      - name: Signaturschlüssel bereitstellen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Unit-Tests und Release-APKs bauen
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon
          :app:testDebugUnitTest :installer:testDebugUnitTest
          :app:assembleRelease :installer:assembleRelease
          -PbackendUrl="$BACKEND_URL"
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"

      - name: APKs und version.json zusammenstellen
        env:
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/bljadflix-main.apk
          cp installer/build/outputs/apk/release/installer-release.apk dist/bljadflix-launcher.apk
          python3 - <<'PY'
          import json, os
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          changelog = (os.environ.get("CHANGELOG") or "").strip().splitlines()
          info = {
              "launcher": {
                  "versionCode": code,
                  "versionName": name,
                  "packageName": "com.shadow.firetv.installer",
              },
              "mainApp": {
                  "packageName": "com.shadow.firetv",
                  "versionCode": code,
                  "versionName": name,
                  "downloadUrl": "/app/download/main",
                  "minLauncherVersionCode": 1,
                  "changelog": changelog[0] if changelog else f"Build {name}",
              },
          }
          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(info, f, ensure_ascii=False, indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/
          retention-days: 30

  deploy:
    needs: [backend-tests, android-build]
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - name: SSH einrichten
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          echo "SSH_CMD=ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Server vorbereiten
        run: |
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            command -v rsync >/dev/null || sudo apt-get install -y rsync
            mkdir -p ~/bljadflix/backend/updates/.incoming
          '

      - name: Backend-Code übertragen
        run: >
          rsync -az
          --exclude '*.db' --exclude '*.db-*'
          --exclude 'config.json' --exclude 'updates/'
          --exclude '__pycache__/' --exclude '*.log'
          -e "$SSH_CMD"
          backend/ "$DEPLOY_USER@$DEPLOY_HOST:bljadflix/backend/"

      - name: APKs übertragen
        run: rsync -az -e "$SSH_CMD" dist/ "$DEPLOY_USER@$DEPLOY_HOST:bljadflix/backend/updates/.incoming/"

      - name: Abhängigkeiten aktualisieren, APKs freigeben, Dienst neu starten
        run: |
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/bljadflix
          venv/bin/pip install -q -r backend/requirements.txt
          mv backend/updates/.incoming/bljadflix-main.apk backend/updates/bljadflix-main.apk
          mv backend/updates/.incoming/bljadflix-launcher.apk backend/updates/bljadflix-launcher.apk
          mv backend/updates/.incoming/version.json backend/updates/version.json
          sudo systemctl restart bljadflix
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/app/version >/dev/null; then
              echo "Backend läuft."
              exit 0
            fi
            sleep 2
          done
          sudo journalctl -u bljadflix -n 80 --no-pager
          exit 1
          REMOTE
